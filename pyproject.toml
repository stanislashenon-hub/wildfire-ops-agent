[project]
name = "wildfire-ops-agent"
version = "0.1.0"
description = "Human-in-the-loop wildfire operations agent: MCP server + LangGraph + Langfuse evals"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.20,<2",          # langchain-mcp-adapters does not support mcp 2.x yet
  "langgraph>=1.0",
  "langchain[anthropic]>=1.0",
  "langchain-mcp-adapters>=0.3",
  "langfuse>=3",
  "httpx",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
